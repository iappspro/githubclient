<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting GitHub...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { max-width: 420px; padding: 2rem; }
        .spinner {
            border: 4px solid #21262d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; color: #8b949e; line-height: 1.5; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
        .code-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #58a6ff;
            font-family: monospace;
            user-select: all;
        }
        .btn {
            display: inline-block;
            background: #238636;
            color: #fff;
            text-decoration: none;
            padding: 0.7rem 1.4rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }
        .btn:hover { background: #2ea043; }
        .hint { font-size: 0.8rem; color: #484f58; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <div id="spinner" class="spinner"></div>
        <h1 id="title">Connecting your GitHub account...</h1>
        <p id="message">Please wait while we process your authorization.</p>
        <div id="result" style="display:none;">
            <div class="code-box" id="pairingCode"></div>
            <a class="btn" id="deepLink" href="#">Open Telegram Bot</a>
            <p class="hint">Or send <b>/start <span id="codeText"></span></b> to the bot manually.</p>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');

            var spinner = document.getElementById('spinner');
            var title = document.getElementById('title');
            var message = document.getElementById('message');
            var result = document.getElementById('result');

            if (!code || !state) {
                spinner.style.display = 'none';
                title.textContent = 'Authorization failed';
                title.className = 'error';
                message.textContent = 'Missing code or state parameter. Please try again from Telegram.';
                return;
            }

            var webhookUrl = decodeURIComponent(state);

            // Generate a short, base64url-safe pairing code
            var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            var pairingCode = '';
            for (var i = 0; i < 8; i++) {
                pairingCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // Send both the pairing code and the OAuth code to TBC
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'pairing_code=' + encodeURIComponent(pairingCode) + '&oauth_code=' + encodeURIComponent(code)
            })
            .then(function () {
                spinner.style.display = 'none';
                title.textContent = 'Almost there!';
                title.className = 'success';
                message.textContent = 'Tap the button below to finish linking your account:';
                result.style.display = 'block';
                document.getElementById('pairingCode').textContent = pairingCode;
                document.getElementById('codeText').textContent = pairingCode;
                document.getElementById('deepLink').href = 'https://t.me/github_client_tgbot?start=pairing_' + pairingCode;
            })
            .catch(function (error) {
                spinner.style.display = 'none';
                title.textContent = 'Connection error';
                title.className = 'error';
                message.textContent = 'Failed to send the code to the bot. Please try again.';
                console.error('Error:', error);
            });
        })();
    </script>
</body>
</html>
