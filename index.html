<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting GitHub...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .container { max-width: 420px; padding: 2rem; }
        .spinner { border: 4px solid #21262d; border-top: 4px solid #58a6ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; color: #8b949e; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
        .btn { display: inline-block; background: #238636; color: #fff; text-decoration: none; padding: 0.8rem 1.6rem; border-radius: 8px; font-weight: 600; margin-top: 1rem; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <div id="spinner" class="spinner"></div>
        <h1 id="title">Connecting your GitHub account...</h1>
        <p id="message">Please wait while we process your authorization.</p>
        <div id="fallback" style="display:none;">
            <a class="btn" href="https://t.me/github_client_tgbot">Open Telegram Bot</a>
            <p style="margin-top:1rem;font-size:0.8rem">If not redirected automatically, tap the button.</p>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');

            var spinner = document.getElementById('spinner');
            var title = document.getElementById('title');
            var message = document.getElementById('message');
            var fallback = document.getElementById('fallback');
            var deepLink = 'https://t.me/github_client_tgbot';

            function showError(t, m) {
                spinner.style.display = 'none';
                title.textContent = t;
                title.className = 'error';
                message.textContent = m;
                fallback.style.display = 'block';
            }

            if (!code || !state) {
                showError('Authorization failed', 'Missing code or state. Run /connect again.');
                return;
            }

            var webhookUrl = state;
            if (webhookUrl.indexOf('http') !== 0) {
                try { webhookUrl = decodeURIComponent(state); } catch (e) {}
            }
            if (webhookUrl.indexOf('http') !== 0) {
                showError('Invalid state', 'Please run /connect again from Telegram.');
                return;
            }

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'oauth_code=' + encodeURIComponent(code)
            })
            .then(function () {
                spinner.style.display = 'none';
                title.textContent = 'Connected!';
                title.className = 'success';
                message.textContent = 'Redirecting to Telegram...';
                setTimeout(function () { window.location.href = deepLink; }, 1000);
            })
            .catch(function () {
                spinner.style.display = 'none';
                title.textContent = 'Almost there!';
                title.className = 'success';
                message.textContent = 'Tap the button below to return to the bot.';
                fallback.style.display = 'block';
            });
        })();
    </script>
</body>
</html>
