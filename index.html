<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting GitHub...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .container { max-width: 420px; padding: 2rem; }
        .spinner { border: 4px solid #21262d; border-top: 4px solid #58a6ff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        p { font-size: 0.9rem; color: #8b949e; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
        .btn { display: inline-block; background: #238636; color: #fff; text-decoration: none; padding: 0.8rem 1.6rem; border-radius: 8px; font-weight: 600; margin-top: 1rem; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <div id="spinner" class="spinner"></div>
        <h1 id="title">Connecting your GitHub account...</h1>
        <p id="message">Please wait while we process your authorization.</p>
        <div id="fallback" style="display:none;">
            <a class="btn" id="fallbackLink" href="#">Open Telegram Bot</a>
        </div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');

            var spinner = document.getElementById('spinner');
            var title = document.getElementById('title');
            var message = document.getElementById('message');
            var fallback = document.getElementById('fallback');

            if (!code || !state) {
                spinner.style.display = 'none';
                title.textContent = 'Authorization failed';
                title.className = 'error';
                message.textContent = 'Missing code or state parameter. Please try again from Telegram.';
                return;
            }

            var pairingCode = state;
            var deepLink = 'https://t.me/github_client_tgbot?start=pair_' + pairingCode;

            var webhookUrl = 'YOUR_WEBHOOK_URL_HERE';

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'oauth_code=' + encodeURIComponent(code) + '&pairing_code=' + encodeURIComponent(pairingCode)
            })
            .then(function () {
                window.location.href = deepLink;
            })
            .catch(function () {
                spinner.style.display = 'none';
                title.textContent = 'Almost there!';
                title.className = 'success';
                message.textContent = 'Tap the button below to finish connecting:';
                document.getElementById('fallbackLink').href = deepLink;
                fallback.style.display = 'block';
            });
        })();
    </script>
</body>
</html>
