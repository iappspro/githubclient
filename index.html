<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting GitHub...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container { max-width: 400px; padding: 2rem; }
        .spinner {
            border: 4px solid #21262d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.2rem; font-weight: 600; }
        p { font-size: 0.9rem; color: #8b949e; }
        .error { color: #f85149; }
        .success { color: #3fb950; }
    </style>
</head>
<body>
    <div class="container">
        <div id="spinner" class="spinner"></div>
        <h1 id="title">Connecting your GitHub account...</h1>
        <p id="message">Please wait while we process your authorization.</p>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const state = params.get('state');

            const spinner = document.getElementById('spinner');
            const title = document.getElementById('title');
            const message = document.getElementById('message');

            if (!code || !state) {
                spinner.style.display = 'none';
                title.textContent = 'Authorization failed';
                title.className = 'error';
                message.textContent = 'Missing code or state parameter. Please try again from Telegram.';
                return;
            }

            const webhookUrl = decodeURIComponent(state);
            const separator = webhookUrl.indexOf('?') === -1 ? '?' : '&';
            const targetUrl = webhookUrl + separator + 'code=' + encodeURIComponent(code);

            fetch(targetUrl, { method: 'GET' })
                .then(() => {
                    spinner.style.display = 'none';
                    title.textContent = 'GitHub connected!';
                    title.className = 'success';
                    message.textContent = 'You can now close this page and return to Telegram.';
                })
                .catch(error => {
                    spinner.style.display = 'none';
                    title.textContent = 'Connection error';
                    title.className = 'error';
                    message.textContent = 'Failed to send the code to the bot. Please try again.';
                    console.error('Error:', error);
                });
        })();
    </script>
</body>
</html>
